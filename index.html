<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget-Watchdog | Financial Security</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Budget-Watchdog</h1>
            <p>Controllo totale della tua esposizione finanziaria</p>
        </header>

        <section id="budget-section" style="margin-bottom: 20px;">
            <input type="number" id="budgetLimit" placeholder="Imposta Budget Annuo (€)">
        </section>

        <section id="input-section">
            <input type="text" id="itemName" placeholder="Nome Spesa (es. Audible, Netflix)">
            <input type="number" id="itemCost" placeholder="Costo (€)">
            <select id="frequency">
                <option value="12">Mensile</option>
                <option value="1">Annuale</option>
            </select>
            <button id="addBtn">Aggiungi</button>
        </section>

        <section id="display-section">
            <div id="total-display">Totale Annuo: €0</div>
            <small id="progress-text" style="color: #94a3b8;">Utilizzo rispetto al budget annuale di 1000€</small>
            <div class="progress-container">
                 <div id="progress-bar"></div>
            </div>
            <ul id="list"></ul>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
